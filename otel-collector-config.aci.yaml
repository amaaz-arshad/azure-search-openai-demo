receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  clickhouse:
    endpoint: tcp://localhost:9000?dial_timeout=10s&compress=lz4
    database: openlit
    username: default
    password: openlit
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_table_name: otel_metrics
    ttl: 720h
    create_schema: true

processors:
  batch:
    timeout: 5s
    send_batch_size: 5000
  filter/llm:
    error_mode: ignore
    traces:
      span:
        - 'not (IsMatch(name, "^(chat|embeddings|completion|responses)\\s.*") or attributes["gen_ai.system"] != nil or attributes["gen_ai.request.model"] != nil or attributes["llm.request.type"] != nil)'

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/llm, batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
